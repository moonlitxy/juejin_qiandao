# 掘金每日签到（GitHub Actions）
#
# 为什么用 Actions 而不是扩展的 chrome.alarms：
# 扩展依赖本机浏览器常驻，电脑关机/休眠/断网就漏签（实测已断过签）。
# Actions 在云端跑，不受本机状态影响。
#
# 必配 Secret：Settings → Secrets and variables → Actions → New repository secret
#   名称 JUEJIN_COOKIE，值为浏览器里复制的完整 cookie 串。
#   ⚠️ 它等同于账号钥匙，绝不能提交进仓库或写进 workflow 文件。
#
# 触发方式：每天定时（北京时间 10:13，见下方 schedule 注释）+ 手动补签。

name: 掘金签到

on:
  # 手动触发：可临时补签，或勾 dry_run 只查状态
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只查询状态，不真正签到'
        type: boolean
        default: false

  # 每天定时签到
  schedule:
    # ┌─ 改签到时间只需改下面这一行 ─────────────────────────┐
    # │ 格式：分 时 日 月 周（分/时都是 UTC，不是北京时间）  │
    # │ 北京时间 = UTC + 8，所以 北京8点20 = UTC 0 点20      │
    # │ 当前 = 每天 北京时间 8:20                            │
    # │   改 北京 9:00  → '0 1 * * *'                       │
    # │   改 北京10:30  → '30 2 * * *'                      │
    # │   改 北京20:00  → '0 12 * * *'                      │
    # └────────────────────────────────────────────────────┘
    # 避开整点：GitHub 的 cron 有 5~15 分钟随机延迟，整点是排队高峰
    # 注意：连续两个月无活动会自动禁用定时任务，届时手动触发一次即可恢复
    - cron: '20 0 * * *'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 签到页要等页面 JS 种下 msToken / ttwid / csrf token，给足超时
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright 的 chromium 有 300MB+， 缓存可省掉每次重新下载
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4 # Node 20 运行时已被 runner 强制升到 24，属官方弃用提示，不影响执行
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: 安装依赖
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium --with-deps

      - name: 执行签到
        id: checkin
        env:
          # 从 Secret 注入；不要用 set -x 或 echo，否则 Cookie 会进日志
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          DRY_RUN: ${{ inputs.dry_run }}
        # 签到失败时以自定义摘要收尾，方便在通知邮件/Red 状态栏一眼看清原因
        run: |
          if node scripts/checkin.mjs ${{ inputs.dry_run && '--dry-run' || '' }}; then
            echo "结论=正常" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "结论=失败" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=签到失败::请看上方日志。Cookie 失效时需更新 Settings → Secrets and variables → Actions → JUEJIN_COOKIE"
            exit 1
          fi
