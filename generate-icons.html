<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成掘金签到插件图标</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f7fa;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .icon-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .icon-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 20px;
            margin-bottom: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button.download {
            background: #4caf50;
        }

        button.download:hover {
            background: #45a049;
        }

        .instructions {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .instructions h3 {
            margin-top: 0;
            color: #1976d2;
        }

        .instructions ol {
            margin-left: 20px;
            line-height: 1.8;
        }

        .preview {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .preview-item {
            text-align: center;
        }

        .preview-item span {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛏️ 掘金签到插件图标生成器</h1>
        <p>使用此工具生成插件所需的各种尺寸图标</p>

        <div class="icon-section">
            <h3>图标预览</h3>
            <div class="preview">
                <div class="preview-item">
                    <canvas id="canvas16" width="16" height="16"></canvas>
                    <span>16x16</span>
                </div>
                <div class="preview-item">
                    <canvas id="canvas48" width="48" height="48"></canvas>
                    <span>48x48</span>
                </div>
                <div class="preview-item">
                    <canvas id="canvas128" width="128" height="128"></canvas>
                    <span>128x128</span>
                </div>
            </div>

            <div>
                <button onclick="generateIcons()">🔄 重新生成</button>
                <button class="download" onclick="downloadIcon('icon16.png', 16)">📥 下载 16x16</button>
                <button class="download" onclick="downloadIcon('icon48.png', 48)">📥 下载 48x48</button>
                <button class="download" onclick="downloadIcon('icon128.png', 128)">📥 下载 128x128</button>
                <button class="download" onclick="downloadAll()">📦 下载全部</button>
            </div>
        </div>

        <div class="instructions">
            <h3>📖 使用说明</h3>
            <ol>
                <li>点击"重新生成"按钮创建新的图标（可以修改源代码自定义图标样式）</li>
                <li>点击单独的下载按钮下载对应尺寸的图标</li>
                <li>或者点击"下载全部"一次性下载所有图标</li>
                <li>将下载的图标文件放入 <code>icons</code> 文件夹中</li>
                <li>重新加载Chrome扩展即可看到新图标</li>
            </ol>
        </div>
    </div>

    <script>
        // 页面加载时生成图标
        window.onload = function() {
            generateIcons();
        };

        // 生成图标
        function generateIcons() {
            const sizes = [16, 48, 128];

            sizes.forEach(size => {
                const canvas = document.getElementById('canvas' + size);
                const ctx = canvas.getContext('2d');

                // 清空画布
                ctx.clearRect(0, 0, size, size);

                // 绘制渐变背景
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                ctx.fillStyle = gradient;

                // 圆角矩形
                const radius = size * 0.2;
                ctx.beginPath();
                ctx.moveTo(radius, 0);
                ctx.lineTo(size - radius, 0);
                ctx.quadraticCurveTo(size, 0, size, radius);
                ctx.lineTo(size, size - radius);
                ctx.quadraticCurveTo(size, size, size - radius, size);
                ctx.lineTo(radius, size);
                ctx.quadraticCurveTo(0, size, 0, size - radius);
                ctx.lineTo(0, radius);
                ctx.quadraticCurveTo(0, 0, radius, 0);
                ctx.closePath();
                ctx.fill();

                // 绘制图标（镐头emoji）
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.5}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⛏', size / 2, size / 2 + size * 0.05);
            });
        }

        // 下载单个图标
        function downloadIcon(filename, size) {
            const canvas = document.getElementById('canvas' + size);

            // 创建下载链接
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 下载所有图标
        function downloadAll() {
            const sizes = [16, 48, 128];
            const filenames = ['icon16.png', 'icon48.png', 'icon128.png'];

            sizes.forEach((size, index) => {
                setTimeout(() => {
                    downloadIcon(filenames[index], size);
                }, index * 300); // 延迟下载，避免浏览器阻止
            });
        }
    </script>
</body>
</html>
