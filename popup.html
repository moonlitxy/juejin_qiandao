<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掘金签到</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- 头部：左侧标题，右侧上次签到 + 设置入口 -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">掘</span>
                <h1>掘金自动签到</h1>
            </div>
            <div class="header-actions">
                <span class="header-info" id="lastCheckInTime">上次签到: 从未</span>
                <button class="btn-text" id="optionsBtn" title="设置" aria-label="打开设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                        <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- 签到状态 -->
        <div class="status-section">
            <div class="status-card">
                <div class="status-main">
                    <div class="status-icon" id="statusIcon">✓</div>
                    <div class="status-info">
                        <div class="status-title" id="statusTitle">加载中...</div>
                        <div class="status-desc" id="statusDesc">正在获取签到状态</div>
                    </div>
                </div>

                <!-- 签到统计 -->
                <div class="stats-section">
                    <div class="stat-item">
                        <div class="stat-value" id="consecutiveDays">0</div>
                        <div class="stat-label">连续签到天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalDays">0</div>
                        <div class="stat-label">本月签到天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="sumDays">0</div>
                        <div class="stat-label">累计签到天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="currentPoint">-</div>
                        <div class="stat-label">当前矿石</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 抽奖结果（默认隐藏，仅当天有结果时显示） -->
        <div class="lottery-section" id="lotterySection" hidden>
            <div class="lottery-card">
                <span class="lottery-icon" id="lotteryIcon">✦</span>
                <span class="lottery-text" id="lotteryText"></span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-section">
            <button class="btn btn-primary action-btn-main" id="manualCheckInBtn">
                <span class="btn-icon">✓</span>
                <span>立即签到</span>
            </button>
            <div class="action-buttons-row">
                <button class="btn btn-secondary" id="openJuejinBtn">
                    <span class="btn-icon">↗</span>
                    <span>打开掘金</span>
                </button>
                <button class="btn btn-secondary" id="manualLotteryBtn">
                    <span class="btn-icon">✦</span>
                    <span>立即抽奖</span>
                </button>
            </div>
        </div>

        <!-- 快速设置 -->
        <div class="settings-section">
            <div class="setting-item">
                <label class="setting-label">自动签到</label>
                <label class="switch">
                    <input type="checkbox" id="autoCheckInToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <label class="setting-label">签到时间</label>
                <input type="time" class="time-input" id="checkInTime" value="09:00">
            </div>
        </div>
    </div>

    <!-- 共享脚本 -->
    <script src="shared/date.js"></script>
    <script src="shared/config.js"></script>
    <script src="shared/messaging.js"></script>
    <script src="shared/notification.js"></script>
    <!-- 页面脚本 -->
    <script src="popup.js"></script>
</body>
</html>
